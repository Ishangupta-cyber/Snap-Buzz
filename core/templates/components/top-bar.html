
  <div class="dock-lg flex p-4 justify-between items-center shadow-xs">
    <div class="flex gap-3">
      <button
        class="size-10 rounded-full bg-gray-100 flex items-center justify-center"
      >
        <div>
          <a href="{% url 'home' %}">
            <img src="{{ request.user.avatar.url }}" alt="Profile" class="size-10 rounded-full">
          </a>
        </div>
      </button>

      <button class="dock-active size-10 rounded-full bg-gray-100">
        <a href="{% url 'search-users' %}"> 
          <i class="text-lg fa-solid fa-magnifying-glass"></i>
        </a>
      </button>
    </div>

    <div class="text-xl font-semibold">{{fillcontent}}</div>

    <div class="flex gap-3">
      <button class="size-10 rounded-full bg-gray-100 flex items-center justify-center">
        <a href ="{% url 'friend-requests' %}">
        <i class="text-lg fa-regular fa-bell"></i>
        </a>
      </button>

      <button
        class="size-10 rounded-full bg-{{color}}-300 flex items-center justify-center"
      >
        <i class="text-lg fa-solid fa-user-plus"></i>
      </button>

      <!-- 3 Dots Dropdown for Logout -->
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="size-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition">
          <i class="text-lg fa-solid fa-ellipsis"></i>
        </div>
        <ul tabindex="0" class="dropdown-content z-50 menu p-2 shadow-lg bg-white rounded-xl w-40 mt-2 border border-gray-100">
          <li>
            <a href="{% url 'logout-user' %}" class="text-red-600 hover:bg-red-50 hover:text-red-700 font-semibold rounded-lg">
              <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
