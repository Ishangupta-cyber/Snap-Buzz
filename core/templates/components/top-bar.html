
  <div class="dock-lg flex p-4 justify-between items-center bg-slate-900/80 backdrop-blur-md border-b border-slate-800 z-40 sticky top-0">
    <div class="flex gap-3">
      <button class="size-10 rounded-full bg-slate-800 flex items-center justify-center ring-2 ring-purple-500/50 hover:ring-purple-400 transition-all shadow-[0_0_10px_rgba(168,85,247,0.3)]">
        <div>
          <a href="{% url 'home' %}">
            <img src="{{ request.user.avatar.url }}" alt="Profile" class="size-10 rounded-full object-cover">
          </a>
        </div>
      </button>

      <button class="size-10 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors flex items-center justify-center">
        <a href="{% url 'search-users' %}">

        </a>

    <div class="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">{{fillcontent}}</div>

    <div class="flex gap-3">
      <button class="size-10 rounded-full bg-slate-800 text-slate-400 hover:text-purple-400 hover:bg-slate-700 transition-colors flex items-center justify-center">
        <a href="{% url 'friend-requests' %}">
        <i class="text-lg fa-regular fa-bell"></i>
        </a>
      </button>

      <button class="size-10 rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/40 hover:text-purple-300 transition-colors flex items-center justify-center">

      </button>

      <!-- 3 Dots Dropdown for Logout -->
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="size-10 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:bg-slate-700 hover:text-white transition-colors">
          <i class="text-lg fa-solid fa-ellipsis"></i>
        </div>
        <ul tabindex="0" class="dropdown-content z-50 menu p-2 shadow-2xl bg-slate-800 rounded-xl w-40 mt-2 border border-slate-700">
          <li>
            <a href="{% url 'logout-user' %}" class="text-red-400 hover:bg-red-500/10 hover:text-red-300 font-semibold rounded-lg">
              <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Logout

          </li>
        </ul>
      </div>
