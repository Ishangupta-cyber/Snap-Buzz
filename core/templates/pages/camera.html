{% extends "base.html" %}
{% load static %}

{% block main %}
<div class="h-full w-full bg-black flex flex-col justify-between relative overflow-hidden">

    
    <div class="relative z-20 flex justify-between items-center p-5 text-white text-2xl">
        <a href="{% url 'home' %}" class="cursor-pointer hover:text-purple-400 transition-colors drop-shadow-md">
            <i class="fa-solid fa-angle-left"></i>
        </a>
        <div class="flex gap-5">
            <button id="filter-btn" class="hover:text-purple-400 transition-colors drop-shadow-md">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button class="hover:text-purple-400 transition-colors drop-shadow-md">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </div>

    <div class="absolute inset-0 z-0">

    
        <video id="video" autoplay playsinline class="w-full h-full object-cover transition-all duration-300"></video>
        
        <img id="preview-image" class="hidden w-full h-full object-cover transition-all duration-300" />
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <div class="relative z-20 flex justify-center items-center pb-10 w-full px-5">
        
        <button id="capture-btn" class="size-20 rounded-full border-[6px] border-white bg-transparent hover:bg-white/20 active:scale-95 transition-all shadow-[0_0_15px_rgba(255,255,255,0.5)]"></button>

        <div id="send-controls" class="hidden w-full flex justify-between items-center">
            <button id="retake-btn" class="btn btn-circle btn-ghost text-white text-xl bg-black/50 hover:bg-black/80 backdrop-blur-md">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <button onclick="sendModal.showModal()" class="btn rounded-full bg-purple-600 hover:bg-purple-700 text-white border-none shadow-[0_0_15px_rgba(168,85,247,0.5)] px-6">
                Send To <i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
        </div>
    </div>
</div>

<dialog id="sendModal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box bg-slate-900 border border-slate-800 text-slate-200 p-0 overflow-hidden">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 backdrop-blur-md sticky top-0 z-10">
            <h3 class="font-bold text-lg">Send To...</h3>
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost"><i class="fa-solid fa-xmark"></i></button>
            </form>
        </div>
        
        <div class="p-2 max-h-[60vh] overflow-y-auto">
            {% csrf_token %}
            {% if friends %}
                <ul class="space-y-1">
                {% for friend in friends %}
                    <li class="flex items-center justify-between p-3 hover:bg-slate-800 rounded-xl transition-colors">
                        <div class="flex items-center gap-3">
                            <img src="{{ friend.avatar.url }}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                            <span class="font-semibold">{{ friend.username }}</span>
                        </div>
                        <button class="send-snap-btn btn btn-sm rounded-full bg-blue-600 hover:bg-blue-700 text-white border-none" data-friend-id="{{ friend.id }}">
                            <i class="fa-regular fa-paper-plane"></i>
                        </button>
                    </li>
                {% endfor %}
                </ul>
            {% else %}
                <div class="p-6 text-center text-slate-500">
                    <i class="fa-solid fa-user-group text-4xl mb-3 opacity-50"></i>
                    <p>You don't have any friends yet.</p>
                </div>
            {% endif %}
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
<script  src="{% static 'camera.js'  %}"  ></script>

{% endblock %}
