{% extends 'base.html' %}
 {% block main%}


 <div class="absolute top-0 w-full">

   {% include 'components/top-bar.html' with fillcontent="Chat" color="yellow"%}
   <div class="space-y-2">
    {% for friend in friends%}
      <a href="{% url 'chat-details' friend.id %}">
        <div class="px-4">
        <div class="flex justify-between items-center py-3">
          <div class="flex gap-3 items-center">
            <div class="relative">
              <img
                src="{{friend.avatar.url}}"
                class="w-14 h-14 rounded-full border-2 border-purple-500 p-[2px] object-cover"
              />

              <span
                class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"
              ></span>
            </div>

            <div>
              <h3 class="font-semibold text-lg">{{friend.username}}</h3>

              <div class="flex items-center gap-1 text-gray-500 text-sm">
                <i class="fa-regular fa-message text-xs"></i>
                <span class="text-red-900">4 new Snaps </span>
                <span> • 5d</span>
              </div>
            </div>
          </div>

          <button class="text-gray-500 text-xl">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>
      </div>
      </a>
    {% endfor %}
      
    </div>
   
  </div>
    


  
  {% include 'components/bottom-navbar.html'%}
  
  {% endblock %}
