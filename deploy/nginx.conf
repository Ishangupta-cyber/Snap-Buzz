# Snap Buzz — Nginx site config.
# Placeholders (__SERVER_NAME__, __APP_DIR__) are filled in by deploy/setup.sh.
# Certbot later adds the HTTPS (443) block + http->https redirect automatically.

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream snapbuzz_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Snaps / stories upload size (Nginx default is only 1MB)
    client_max_body_size 20M;

    location /static/ {
        alias __APP_DIR__/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias __APP_DIR__/media/;
        expires 1d;
        add_header X-Content-Type-Options nosniff;
    }

    # WebSockets (chat) — must forward the Upgrade headers and keep the connection open
    location /ws/ {
        proxy_pass http://snapbuzz_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://snapbuzz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
